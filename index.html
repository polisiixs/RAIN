<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIN Messenger</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; height: 90vh; }
        
        /* Стили для экрана входа */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        #login-screen input, #login-screen button {
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
 
        /* Стили для чата (скрыты по умолчанию) */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #messages { list-style: none; padding: 10px; margin: 0; flex-grow: 1; overflow-y: auto; border: 1px solid #ccc; background: white; border-radius: 8px; }
        #messages li { padding: 8px 12px; margin-bottom: 8px; border-radius: 15px; max-width: 70%; word-wrap: break-word; }
        .my-message { background: #dcf8c6; align-self: flex-end; margin-left: auto; }
        .other-message { background: #fff; border: 1px solid #ddd; }
        .sender-name { font-size: 0.75em; color: #666; margin-bottom: 2px; display: block; }
        #form { display: flex; margin-top: 10px; gap: 8px; }
        #input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
 
    <!-- ЭКРАН ВХОДА (будет виден первым) -->
    <div id="login-screen">
        <h2>Вход в RAIN</h2>
        <input id="login-number" type="text" placeholder="Твой номер (например, #2)" />
        <input id="login-password" type="password" placeholder="Пароль" />
        <button id="login-btn">Войти</button>
        <p id="login-error" style="color: red; display: none;">Неверный номер или пароль</p>
    </div>
 
    <!-- ЭКРАН ЧАТА (изначально скрыт) -->
    <div id="chat-screen">
        <h3 id="hero-name-display" style="margin: 5px 0;">...</h3>
        <ul id="messages"></ul>
        <form id="form" action="">
            <input id="input" autocomplete="off" placeholder="Напиши сообщение..." />
            <button>Отправить</button>
        </form>
    </div>
 
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
 
        // Находим все элементы на странице
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginNumber = document.getElementById('login-number');
        const loginPassword = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        const heroNameDisplay = document.getElementById('hero-name-display');
        
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
 
        let currentHeroName = ''; // Здесь будем хранить имя героя после входа
 
        // --- ЛОГИКА ВХОДА ---
        loginBtn.addEventListener('click', () => {
            const number = loginNumber.value;
            const password = loginPassword.value;
 
            // Отправляем данные на сервер для проверки
            socket.emit('login', { number: number, password: password });
        });
 
        // Сервер ответил "Успешно"
        socket.on('login success', (data) => {
            currentHeroName = data.name; // Запоминаем имя (Капитан Америка)
            heroNameDisplay.textContent = 'Вы вошли как: ' + currentHeroName;
            
            // Прячем экран входа, показываем чат
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
        });
 
        // Сервер ответил "Ошибка"
        socket.on('login error', (msg) => {
            loginError.textContent = msg;
            loginError.style.display = 'block'; // Показываем красный текст ошибки
        });
 
        // --- ЛОГИКА ЧАТА ---
        socket.on('chat history', (history) => {
            messages.innerHTML = ''; 
            history.forEach(msg => addMessageToDOM(msg));
        });
 
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                // Теперь мы не отправляем имя, сервер сам знает, кто это
                socket.emit('chat message', { text: input.value });
                input.value = '';
            }
        });
 
        socket.on('chat message', (msg) => {
            addMessageToDOM(msg);
        });
 
        function addMessageToDOM(msg) {
            const item = document.createElement('li');
            const isMine = msg.sender === currentHeroName; 
            item.className = isMine ? 'my-message' : 'other-message';
            
            const senderText = msg.sender || 'Аноним';
            const messageText = msg.text || 'Пустое сообщение';
            
            item.innerHTML = `<span class="sender-name">${senderText}</span> ${messageText}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
